[settings]
minimum_release_age = "0"

[tools]
# hk is the only pinned tool. Its version must equal the version in hk.pkl, in
# both the hk import and the hk-config import.
hk = "2.11.1"
jactionlint = "latest"
go = "latest"
betterleaks = "latest"
gofumpt = "latest"
pkl = "latest"
staticcheck = "latest"
tombi = "latest"
yamlfmt = "latest"
# Git 2.54 and later lets hk install config-based hooks instead of script
# shims, so the hook mechanism does not depend on the host Git. The package is
# about 260 MB and every repository on the machine shares it.
"conda:git" = "latest"
# Prefer a published release over a compile: the github: backend downloads the
# macOS and Linux binaries for arm64 and amd64, and the go: backend builds the
# tool on every machine and every CI run. A tool keeps go: when no release
# covers both platforms (goimports, govulncheck), or when its binary cannot
# read the code: gohawk v0.7.2 was built with Go 1.27.0 and panics on a module
# that Go 1.27.3 compiles. The errcheck, sumtype, testifylint, and nilaway
# analyzers run inside constable, so they need no tool of their own.
"github:nnutter/constable" = "latest"
"github:nnutter/mdlint" = "latest"
"github:nnutter/timber" = "latest"
"github:securego/gosec" = "latest"
"go:github.com/kojah/gohawk" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

[tasks.all]
description = "Run fix, test, and check"
run = [{ task = "fix" }, { task = "test" }, { task = "check" }]

[tasks.ci-test]
description = "Run tests with the race detector and shuffled order"
run = "go test -race -shuffle=on ./..."

[tasks.coverage]
alias = "cover"
description = "Run tests and generate coverage report"
run = "go test -coverprofile=coverage.out -covermode=atomic ./... && go tool cover -func=coverage.out"

[tasks.setup]
description = "Install hk git hooks"
run = "hk install --mise"

[tasks.test]
description = "Run tests with coverage"
run = "go test -cover ./..."

[tasks.fix]
description = "Fix all files, or only the supplied files"
usage = 'arg "[staged_files]" var=#true'
run = '''
if [ -z "${usage_staged_files:-}" ]; then
  hk fix --all
else
  hk fix ${usage_staged_files}
fi
'''

[tasks.check]
description = "Check all files without writing fixes"
run = "hk check --all"

[tasks.on-start]
description = "Pi mise-hooks: run fix, test, and check before agent starts"
run = [{ task = "all" }]

[tasks.on-stop]
description = "Pi mise-hooks: fix edited files, then test and check"
usage = 'arg "[staged_files]" var=#true'
run = ["mise run fix ${usage_staged_files}", "mise run test", "mise run check"]
