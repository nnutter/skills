[settings]
minimum_release_age = "0"

[env]
# conda:git exports CONDA_PREFIX to every child process, and a Python tool then
# looks for site-packages inside the Git package. This repository has no conda
# environment, so remove the variable.
CONDA_PREFIX = false

[tools]
# hk is the only pinned tool: hk.pkl imports this exact version, and the
# hk-config package version carries it too.
hk = "2.11.1"
jactionlint = "latest"
# Git 2.54 and later lets hk install config-based hooks, so hooks do not need
# files in .git/hooks. A system Git below 2.54 falls back to script shims.
"conda:git" = "latest"
gitleaks = "latest"
# Python only runs the tests and scripts here, so it takes the latest release;
# a repository whose own code is Python may pin it.
python = "latest"
# The pypi backend builds the agentskills lock with uv, so uv is a tool here
# rather than something the backend borrows from the host.
uv = "latest"
"go:github.com/nnutter/timber" = "latest"
"github:nnutter/mdlint" = "latest"
pkl = "latest"
"pypi:agentskills-tools" = "latest"
ruff = "latest"
tombi = "latest"
ty = "latest"
yamlfmt = "latest"

[tasks.all]
description = "Run fix, test, and check"
run = [{ task = "fix" }, { task = "test" }, { task = "check" }]

[tasks.setup]
description = "Install hk git hooks"
run = "hk install --mise"

[tasks.test]
description = "Run the reference tests"
run = "python3 -B -m unittest discover -s skill-tests -v"

[tasks.test-integration]
description = "Exercise the reference tasks in a disposable Go repository"
run = "skill-tests/verify-tasks"

[tasks.fix]
description = "Fix all files, or only the supplied files"
usage = 'arg "[staged_files]" var=#true'
run = '''
if [ -z "${usage_staged_files:-}" ]; then
  hk fix --all
else
  hk fix ${usage_staged_files}
fi
'''

[tasks.check]
description = "Check all files without writing fixes"
run = "hk check --all"

[tasks.on-start]
description = "Run fix, test, and check before the agent starts"
run = [{ task = "all" }]

[tasks.on-stop]
description = "Fix edited files, then test and check"
usage = 'arg "[staged_files]" var=#true'
run = ["mise run fix ${usage_staged_files}", "mise run test", "mise run check"]
